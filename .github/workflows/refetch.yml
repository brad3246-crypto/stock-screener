name: Quarterly DART refetch

# 분기 실적시즌(3·5·8·11월 25일 09:00 UTC = 18:00 KST) 자동 재수집.
# 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  schedule:
    - cron: "0 9 25 3,5,8,11 *"
  workflow_dispatch:

permissions:
  contents: write   # 갱신된 parquet 커밋용

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # OpenDartReader 0.3.2 requires >=3.13

      - name: Install deps
        run: pip install -r requirements-fetch.txt

      # 한국 DART 수집은 여기서 하지 않는다: GitHub 서버에서는 수집이 실패해
      # fundamentals.parquet를 빈 값으로 덮어썼음(2026-08-25, 채움률 1%).
      # 한국 데이터는 사용자 PC 예약작업(refresh_data.bat → screener.publish)이 검증 후 푸시.

      - name: Fetch US/JP financials (yfinance)
        run: python -m screener.global_fetch

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/global_fundamentals.parquet
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 미국·일본 재무 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
